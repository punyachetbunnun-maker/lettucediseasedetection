
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lettuce Disease Detection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Lettuce Disease Detection</h1>

  <button id="startCamera" type="button">Start Camera</button>

  <video id="video" autoplay playsinline muted></video>

  <h2>Location</h2>
  <p>Latitude: <span id="latitude">Waiting...</span></p>
  <p>Longitude: <span id="longitude">Waiting...</span></p>
  <p id="locationStatus">Location not started.</p>

  <button id="detectDisease" type="button" disabled>
    Detect Disease
  </button>

  <h2>Result</h2>
  <div id="result" role="status" aria-live="polite">No result yet.</div>

  <script src="main.js?v=6"></script>
</body>
</html>
